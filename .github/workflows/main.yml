
name: Build Geode Android Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest
          bindings: geode-sdk/bindings
          bindings-ref: main
          use-cpm-cache: false

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: geode-android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
